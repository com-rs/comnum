# Timing synchronisation: QPSK with root-raised-cosine pulses (roll-off 0.25) at two
# samples per symbol, received by a clock 100 ppm slower than the transmitter's, so that
# the sampling instant slides by one symbol every 10 000 symbols, at an SNR of 25 dB.
# The eye after the matched filter is smeared by the drift; the Gardner detector
# (Gardner 1986) drives an interpolator back to the centre of the eye. With a loop gain
# kp of 0, the loop does not move: the samples keep the drift, and the points after the
# decimation turn from QPSK into clouds between the symbols; with kp = 3e-3, the points
# are back on QPSK after the time the loop takes to lock. Over the last 6144 symbols, the
# symbol error rate is 0.75 without the loop and 0 with it.
# In the playground, the selector "traced" above a scope tab chooses the loop gain.
name: tutorial_timing_sync
description: QPSK with a sampling clock offset, with and without Gardner clock recovery
seed: 4
grid:
  kp: [0.0, 3e-3]
link:
  - {type: source, constellation: QPSK, n_symbols: 8192}
  - {type: pulse_shape, sps: 2, rolloff: 0.25}
  - {type: clock_offset, ppm: 100}
  - {type: awgn, snr_db: 25}
  - {type: matched_filter, rolloff: 0.25}
  - {type: scope, label: eye_received, view: eye}
  - {type: gardner, kp: $kp, ki: 0.0}
  - {type: scope, label: eye_recovered, view: eye}
  - decimate
  - {type: scope, label: sampled}
  - {type: frame_sync, start: 0, length: 512, max_delay: 16}
metrics: {report: [ser, evm], skip_start: 2048}
stop: {max_trials: 1}
