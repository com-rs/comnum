# Constellations in noise: BPSK, QPSK, 8-PSK, 16-QAM and 64-QAM over AWGN at the same
# Eb/N0 of 12 dB. Every constellation has unit energy, so the more points, the closer
# they are for the same energy per bit: the clouds keep about the same size relative to
# the energy, while the decision regions shrink, and the symbol error rate grows with
# the order: 9.0e-9, 1.8e-8, 1.9e-4, 5.5e-4 and 5.7e-2 by the closed forms (Proakis &
# Salehi, Digital Communications, 5th ed., Sec. 4.3, comnum.theory_ser); the trial of
# 4096 symbols counts 0, 0, 0, 3 and 258 errors (7.3e-4 and 6.3e-2).
# In the playground, the selector "traced" above a scope tab chooses the constellation.
name: tutorial_constellations
description: BPSK to 64-QAM over AWGN at the same Eb/N0
seed: 2
grid:
  constellation: [BPSK, QPSK, 8-PSK, 16-QAM, 64-QAM]
link:
  - {type: source, constellation: $constellation, n_symbols: 4096}
  - {type: scope, label: transmitted}
  - {type: awgn_ebn0, ebn0_db: 12}
  - {type: scope, label: received}
metrics: {report: [ser, ber, evm]}
stop: {max_trials: 1}
