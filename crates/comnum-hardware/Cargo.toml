[package]
name = "comnum-hardware"
description = "Hardware impairments of comnum: power amplifiers, phase noise, lasers, optical modulators, photodiodes, PIN-FET receiver, coherent receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/comnum-hardware"
keywords = ["power-amplifier", "phase-noise", "predistortion", "laser", "optics"]
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
all-features = true

[lints]
workspace = true

[dependencies]
comnum-core.workspace = true
comnum-math.workspace = true
comnum-dsp.workspace = true

[features]
default = ["optical"]
# lasers, modulators, photodiodes, optical hybrid, coherent receiver
optical = []
