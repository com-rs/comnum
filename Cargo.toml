[workspace]
resolver = "3"
# the layers of docs/ARCHITECTURE.md, bottom-up; dependencies point downward only
members = [
    # layer 0: foundation
    "crates/comnum-core",
    "crates/comnum-math",
    # layer 1: generic signal processing
    "crates/comnum-dsp",
    # layer 2: link blocks
    "crates/comnum-fec",
    "crates/comnum-mapping",
    "crates/comnum-waveform",
    "crates/comnum-mimo",
    "crates/comnum-channel",
    "crates/comnum-hardware",
    "crates/comnum-metrics",
    # layer 3: simulation
    "crates/comnum-sim",
    # layer 4: integration
    "crates/comnum-spec",
    "crates/comnum-systems",
    "crates/comnum",
    # bindings and validation
    "bindings/comnum-py",
    "bindings/comnum-wasm",
    "validation",
]
default-members = [
    "crates/comnum-core",
    "crates/comnum-math",
    "crates/comnum-dsp",
    "crates/comnum-fec",
    "crates/comnum-mapping",
    "crates/comnum-waveform",
    "crates/comnum-mimo",
    "crates/comnum-channel",
    "crates/comnum-hardware",
    "crates/comnum-metrics",
    "crates/comnum-sim",
    "crates/comnum-spec",
    "crates/comnum-systems",
    "crates/comnum",
    "validation",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"          # MSRV, tested in CI
license = "MIT OR Apache-2.0"
authors = ["Vincent Choqueuse <vincent.choqueuse@gmail.com>"]
repository = "https://github.com/com-rs/comnum"
homepage = "https://com-rs.github.io/comnum/"
# the keywords of the facade `comnum`; every other crate lists its own
keywords = ["communications", "wireless", "optics", "simulation", "dsp"]
categories = ["science", "simulation"]

[workspace.dependencies]
# the crates of the workspace (one version, released together)
comnum-core = { path = "crates/comnum-core", version = "0.3.1" }
comnum-math = { path = "crates/comnum-math", version = "0.3.1" }
comnum-dsp = { path = "crates/comnum-dsp", version = "0.3.1" }
comnum-fec = { path = "crates/comnum-fec", version = "0.3.1" }
comnum-mapping = { path = "crates/comnum-mapping", version = "0.3.1" }
comnum-waveform = { path = "crates/comnum-waveform", version = "0.3.1" }
comnum-mimo = { path = "crates/comnum-mimo", version = "0.3.1" }
comnum-channel = { path = "crates/comnum-channel", version = "0.3.1" }
comnum-hardware = { path = "crates/comnum-hardware", version = "0.3.1" }
comnum-metrics = { path = "crates/comnum-metrics", version = "0.3.1" }
comnum-sim = { path = "crates/comnum-sim", version = "0.3.1" }
comnum-spec = { path = "crates/comnum-spec", version = "0.3.1" }
comnum-systems = { path = "crates/comnum-systems", version = "0.3.1" }
comnum = { path = "crates/comnum", version = "0.3.1", default-features = false }
# third-party
num-complex = "0.4"
ndarray = "0.16"
rustfft = "6.2"
rayon = "1.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_norway = "0.9"
toml = "0.8"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"  # usize -> f64 is pervasive in numeric code
unwrap_used = "deny"
expect_used = "warn"
allow_attributes_without_reason = "warn"
# numeric-code exceptions to `pedantic`, recorded in docs/adr/0005-lint-exceptions.md
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
many_single_char_names = "allow"
module_name_repetitions = "allow"
needless_range_loop = "allow"
float_cmp = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
suboptimal_flops = "allow"     # mul_add changes the rounding of published results
manual_midpoint = "allow"      # f64::midpoint changes the rounding of published results
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_panics_doc = "allow"
naive_bytecount = "allow"      # suggests an extra dependency for test code

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"

[profile.test]
opt-level = 2
