id: ding2014_outage
title: Outage of downlink NOMA with users dropped at random in a disc
literature: ding2014
evidence: [table, curve]
source:
  kind: paper
  reference: "Z. Ding, Z. Yang, P. Fan, H. V. Poor, On the performance of non-orthogonal multiple access in 5G systems with randomly deployed users, IEEE Signal Process. Lett. 21(12), 1501-1505, 2014"
  locator: "the table of Fig. 3 (outage x 1e-4, rho = 80 dB, alpha = 3) verbatim; Fig. 1(a) read on the raster in log10 (0.05 decade)"
  file: multiple-access/2014_ding_noma-randomly-deployed-users_spl.pdf
description: >
  Two users in a disc, path loss 1 + d^alpha, Rayleigh fading, a = (4/5, 1/5)
  (comnum::mimo::noma). Fig. 3: the high-SNR outage (11) with N = 10 Gauss-Chebyshev
  nodes against the "anal." rows, the exact outage (9) against the "simul." rows, the
  orthogonal random user F((2^(R1+R2) - 1)/rho) against the conventional row. Fig. 1(a):
  a Monte Carlo of 1e6 drops per point (positions, Rayleigh gains, ordering, SIC on the
  rates of eq. (2)) against the simulated points, log10 of the outage, 10 to 35 dB.
run:
  test: validation/tests/mimo/ding2014.rs::ding_2014_fig_3_table_and_fig_1a
tier: campaign
duration: "under 1 s"
tolerance: {atol: 0.08}
why: >
  the "anal." rows are printed to four digits; the "simul." and conventional rows are the
  paper's Monte Carlo at 1e-5 to 1e-3 events, its trials not given (10 %); Fig. 1(a) is
  read to 0.05 decade and the Monte Carlo of 1e6 drops adds up to 0.04 decade at 1e-4
findings:
  - "the anal. rows of Fig. 3 are eq. (11) with N = 10 to their four digits; the simul. rows are 0.2 to 7.5 % from the exact eq. (9) (user 2 case 1: 0.1787 against 0.1662), the paper's Monte Carlo"
  - "the text calls the table of Fig. 3 'Table III'; eq. (23) reads log(rho log log M) for log(rho log M); Fig. 2(b) matches Rayleigh fading without path loss, not the caption's 5 m and alpha = 2"
