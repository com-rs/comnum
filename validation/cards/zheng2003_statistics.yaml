id: zheng2003_statistics
title: Correlations, level-crossing rate and fade duration of the sum-of-sinusoids Rayleigh fading
literature: zheng2003
evidence: [closed_form]
source:
  kind: paper
  reference: "Y. R. Zheng, C. Xiao, Simulation models with correct statistical properties for Rayleigh fading channels, IEEE Trans. Commun. 51(6), 920-928, 2003"
  locator: "Theorem 1, eqs. (16a)-(16e); Theorem 3, eqs. (19a)-(19b); the model of eqs. (14)-(15), (21); M = 8 as in Figs. 1-10"
  file: wireless-channels/2003_zheng_simulation-models-rayleigh-fading_tcom.pdf
description: >
  One tap of unit power of comnum::channel::multipath::Tdl with 8 sinusoids (the angles of
  eq. (15), a new theta per realisation, independent phases on I and Q). The ensemble
  correlations over 20 000 realisations at f_D tau = 0 to 10 against J0(2 pi f_D tau)
  (eqs. (16a), (16e)) and zero (eq. (16c)); the level-crossing rate and the average fade
  duration of the envelope, over 400 realisations of 200 Doppler periods sampled at
  f_D T_s = 0.002, against eqs. (19a)-(19b) from -20 to +5 dB, and the closed forms of
  comnum (rayleigh_level_crossing_rate, rayleigh_average_fade_duration) against the
  values of eq. (19) computed outside comnum.
run:
  test: validation/tests/wireless_channels/zheng2003.rs::zheng_xiao_2003_correlations_level_crossings_and_fades
tier: campaign
duration: "about 10 s"
tolerance: {atol: 0.03}
why: >
  the correlations are means of 20 000 products of unit variance (standard error about
  0.007); the level-crossing counts are some 10^3 to 10^4 per level (a few per cent), and
  eqs. (19) hold for M -> infinity (Theorem 3), the model having 8 sinusoids
findings:
  - "eq. (16f), the finite-M autocorrelation of the squared envelope, is above its limit 4 + 4 J0^2, where the simulated curves of Fig. 6 are below it: the finite-M term appears wrong (not checked here)"
  - "with 8 sinusoids the level-crossing rate is within 2.1 % and the fade duration within 3.5 % of eqs. (19) from -20 to 0 dB, and 5.1 % and 5.8 % off at +5 dB, where 64 sinusoids are within 0.8 %: eqs. (19) are the limit M -> infinity (Theorem 3)"
  - "eqs. (20b)-(20c) and (21) print sqrt(2/M) for 2/sqrt(M): as printed the power is 1, not 2"
  - "comnum draws independent phases on the in-phase and quadrature sums with unit amplitudes, not the common phi and the amplitudes cos psi_n, sin psi_n of eq. (14): the second-order statistics are those of Theorem 1"
