id: dvbt_tablea1
title: The C/N of DVB-T for a BER of 2e-4 after the Viterbi decoder
literature: dvbt
evidence: [table]
source:
  kind: standard
  reference: "ETSI EN 300 744 V1.6.2, Digital Video Broadcasting (DVB); Framing structure, channel coding and modulation for digital terrestrial television, 2015"
  locator: "Annex A, Table A.1: the required C/N for a BER of 2e-4 after Viterbi, non-hierarchical, 8K, perfect channel estimation, Gaussian, Ricean (F1) and Rayleigh (P1) channels of Annex B, Table B.1"
  file: standards/etsi_en-300-744_v1.6.2_dvb-t.pdf
description: >
  Bursts of 200 random transport packets through comnum::systems::dvbt::Dvbt in the 8K
  mode (energy dispersal, RS(204, 188), the outer interleaver, the punctured inner code,
  the inner interleaver, the constellations of Figure 9, the frame with its pilots and
  TPS), the cells multiplied by the static gains of F1 or P1 (Table B.1) at the carrier
  frequencies, white Gaussian noise of the variance of a carrier at the C/N (the mean
  carrier power, pilots boosted, over the C/N), exact LLRs with the known gains, soft
  Viterbi decoding; the BER of the bytes entering the inner coder. The C/N at a BER of
  2e-4, interpolated between points 0.2 dB apart with 10^6 bits at least per point.
run:
  test: validation/tests/systems/dvbt.rs::the_required_cn_follows_table_a1_of_en_300_744
tier: campaign
duration: "210 s on an Apple M6 (release)"
tolerance: {atol: 0.2}
why: >
  Gaussian channel (the default, 0.2 dB): the table is printed to 0.1 dB in italics
  ("approximate", NOTE 1), and the Monte Carlo error of a crossing with 10^6 bits is
  about 0.05 dB. F1 (0.3 dB) and P1 (0.8 dB): the channels are static, so the result
  depends on the realisation of |H| over the band, which the standard does not fix
  completely (the frequency reference of the echoes: shifting it by the 32/7 MHz of the
  centre carrier named in Annex A moves the P1 threshold of 16-QAM 3/4 by 0.6 to 1.5 dB
  and F1 by 0.2 to 0.6 dB); the tolerances are the agreement obtained with the
  baseband reference k'/TU, the closest of the three tried
findings:
  - "Gaussian channel: the 15 values of Table A.1 within 0.12 dB (QPSK 3.52 to 7.92 dB, 16-QAM 9.30 to 14.45 dB, 64-QAM 13.90 to 20.25 dB): the whole chain, its C/N convention (the mean carrier power with the boosted pilots, 0.33 dB above the data cells) and the soft Viterbi decoder of the standard's simulation are reproduced"
  - "F1: within 0.26 dB, comnum 0.0 to 0.26 dB above the table except 64-QAM 5/6 (0.23 dB below)"
  - "P1: comnum 0.1 to 0.7 dB below the table for the 15 cases (largest: 16-QAM 5/6, 20.58 against 21.3 dB; 16-QAM 3/4, 17.58 against 18.1 dB), not explained beyond the sensitivity of a static channel to its frequency reference: the echoes applied at 32/7 MHz + k'/TU give 16.05 and 20.95 dB for these two cases, and at -32/7 MHz 16.98 and 19.72 dB, further from the table; the decoder of the standard (soft or hard metric, quantisation, traceback) is not given either"
