id: islam2002_fig6b
title: Double Rayleigh backscattering of a Raman-pumped span against the on-off gain (Islam 2002, Fig. 6(b))
literature: islam2002
evidence: [curve]
source:
  kind: paper
  reference: "M. N. Islam, Raman amplifiers for telecommunications, IEEE J. Sel. Topics Quantum Electron. 8(3), 548-559, 2002"
  locator: "Fig. 6(b), the four curves read on the grid at 0, 10, 20, 25 and 30 dB of on-off gain; the fibre parameters of Sec. III-A, text"
  file: fiber/2002_islam_raman-amplifiers-telecommunications_jstqe.pdf
description: >
  The effective Rayleigh reflection coefficient R^2 (dB), the doubly backscattered
  power over the signal power at the end of the span, of a span pumped at 1451 nm
  (counter-propagating, assumed: the paper does not state it; a co-propagating pump
  gives the same R^2 for a small signal) for a signal at 1550 nm of 1 uW: SMF-28 of 80
  and 100 km (0.25 dB/km at the signal, 0.29 at the pump, 1.62 dB/(W km), Rayleigh
  coefficient -42.3 dB/km) and the dispersion-compensating fibres DK-40 (6.5 km) and
  DK-80 (13 km) (0.49 and 0.63 dB/km, 13.5 dB/(W km), -33.8 dB/km). The pump power of
  every on-off gain is found by bisection; R^2 is the closed form of the module on the
  solved profile, kappa^2 of the double integral of G(z')^2 / G(z)^2 (Bromage 2004,
  eqs. (13)-(15)), with kappa = 10^(coefficient/10) per km.
run:
  test: validation/tests/fiber/islam2002.rs::islam_2002_fig_6b_double_rayleigh_against_the_on_off_gain
tier: ci
duration: "0.5 s"
tolerance: {atol: 1.5}
why: "the reading precision of the figure (minor grid of 5 dB, thick raster lines): +-1.5 dB"
findings:
  - "within the reading at 16 of the 20 points; four points are 1.6 to 3.0 dB off: SMF-28 of 80 km at 20 and 25 dB (-45.4 and -38.8 dB against -47 and -41 read), DK-40 at 20 dB (-35.4 against -38) and DK-80 at 30 dB (-18.0 against -15); not explained: the paper does not write its DRS model (it cites Hansen et al. 1998) nor the signal power, and the module's closed form (Bromage 2004, eqs. (13)-(15), small signal) makes the 80 and 100 km curves of SMF-28 coincide above 20 dB (the double pass of the high-gain end of the span dominates) and the two DCF curves converge (4.5 dB apart at 0 dB, 1.4 at 30), where the figure keeps them 1 to 2 and 3 dB apart"
  - "without pump the closed form gives -56.7 dB (SMF-28, 80 km), -55.6 (100 km), -56.2 (DK-40) and -51.7 dB (DK-80) against the -57, -57, -57 and -52 dB read: the paper's Rayleigh scattering coefficient is 10 log10 of kappa in 1/km"
  - "the pump direction does not matter for a small signal: the double integral is invariant under z -> L - z (checked to 1e-6 dB in the test)"
