id: ccsds131_exact
title: The tables, polynomials, markers and code lengths of CCSDS 131.0-B-5
literature: ccsds131
evidence: [table]
source:
  kind: standard
  reference: "CCSDS 131.0-B-5, TM Synchronization and Channel Coding, Recommended Standard (Blue Book), Issue 5, September 2023"
  locator: "Table F-1 and examples 1-2 of Annex F; Annex G; Sec. 4.3.8; Table 3-1; Tables 6-2 and 7-5; Tables 7-1, C-1 and Sec. 7.4.2; Sec. 10.4.3 NOTE 2; Figures 9-1 to 9-6"
  file: standards/ccsds_131.0-b-5_2023_tm-sync-channel-coding.pdf
description: >
  comnum::fec::ccsds and comnum::systems::ccsds against the values the standard prints,
  which gives no error-rate figure: the 256 rows of Table F-1 (alpha^i of the field of
  F(x) and its dual-basis image), the coefficients of g(x) of Annex G, the sizes of an
  interleaved Reed-Solomon codeblock, the output sequences of Table 3-1, the codeword
  lengths of Tables 6-2 and 7-5, ten random codewords of every LDPC encoder against the
  parity checks of Table 7-1 and Sec. 7.4.2, the first 40 bits of both pseudo-random
  sequences and the bits of the markers.
run:
  test: validation/tests/systems/ccsds131.rs::the_codes_follow_the_tables_of_ccsds_131_0_b_5
tier: campaign
duration: "1 s in release"
tolerance: {exact: true}
why: "tables, polynomials and lengths: every value must be equal"
findings: []
