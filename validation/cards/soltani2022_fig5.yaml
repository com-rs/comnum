id: soltani2022_fig5
title: Power maps of four bidirectional Raman designs over 80 km (Soltani et al. 2022, Table III and Fig. 5)
literature: soltani2022
evidence: [curve]
source:
  kind: paper
  reference: "M. Soltani, F. Da Ros, A. Carena, D. Zibar, Spectral and spatial power evolution design with machine learning-enabled Raman amplification, J. Lightw. Technol. 40(12), 3546-3556, 2022"
  locator: "Table III (the pump powers, verbatim) and Fig. 5(a)-(d) (the power of every channel along the span, read from the vector paths to 0.01 dB): five channels every 10 km and the forty channels at 80 km"
  file: fiber/2022_soltani_spectral-spatial-power-evolution-ml-raman_jlt_arxiv.pdf
description: >
  80 km of single-mode fibre, 40 channels at 192.05 + 0.1 k THz launched at 0 dBm, four
  co-pumps and four counter-pumps at 1366, 1425, 1455 and 1475 nm whose powers are the
  four designs of Table III (a: CNN only, b, c, d: CNN+DE with the weights m(1), m(2),
  m(3)); 0.2 dB/km for the signals, 0.25 and 0.32 dB/km for the first- and second-order
  pumps, a constant effective area of 80 um^2, the gain spectrum of standard silica
  (RamanGain::ssmf) scaled to the peak of the paper, 0.4125 1/(W km), and not scaled
  with the frequency of the pump: the coupling of GNPy up to its version 2.4, with which
  the maps were computed (a boundary-value solver with residual control, 500 m, 1e-6).
  Raman::solve at 50 m; the power of every channel along the span (dBm).
run:
  test: validation/tests/fiber/soltani2022.rs::soltani_2022_fig_5_power_maps_of_table_iii
tier: ci
duration: "about 2 s"
tolerance: {atol: 1.0}
why: >
  the agreement obtained, with what the paper does not give: the table of its gain
  spectrum (only the shape, standard silica, and the peak), the version of GNPy (the
  coupling of the versions up to 2.4 is assumed), the losses of the pump couplers
  (assumed zero); the readings themselves are within 0.01 dB
findings:
  - "along the span the five channels are within 0.39, 0.38, 0.38 and 0.35 dB of the figure for the designs a, b, c, d (+0.04 to +0.18 dB on average); at 80 km the forty channels are 0.17, 0.19, 0.33 and 0.28 dB above it on average, 0.71, 0.67, 0.91 and 0.84 dB at most"
  - "with the efficiency scaled with the pump frequency (the default of comnum and of GNPy 3.0.1) the powers at 80 km are 0.70 to 0.88 dB above the figure on average: the convention moves the map by about 0.6 dB"
  - "the power excursions of Table IV are not all reproduced: J0 3.68, 3.18, 3.32, 3.39 dB against 3.58, 2.81, 2.97, 3.06 and J1 2.05, 1.27, 1.67, 1.47 against 1.48, 1.80, 0.88, 0.90 (J1 is the spread of the forty channels at one distance, here mostly at 80 km where the gap to the figure is largest); not explained, the gain table and the coupler losses not being given"
