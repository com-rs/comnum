id: richardson2001_table1
title: Thresholds of Gallager's algorithms A, B and of algorithm E on the BSC, and the capacity columns
literature: richardson2001
evidence: [table]
source:
  kind: paper
  reference: "T. J. Richardson, R. L. Urbanke, The capacity of low-density parity-check codes under message-passing decoding, IEEE Trans. Inf. Theory 47(2), 599-618, 2001"
  locator: "Table I (columns A, B, E, eps_opt) and Table II (column sigma_opt); eqs. (3), (4), (6), Examples 3-5"
  file: coding/2001_richardson_capacity-ldpc-message-passing_it.pdf
description: >
  Density evolution of the six regular ensembles (3, 6), (4, 8), (5, 10), (3, 5), (4, 6)
  and (3, 4) under Gallager's algorithm A (eq. (6)), algorithm B (Example 4, Gallager's
  choice of b) and the ternary algorithm E (Example 5, the weight of every iteration
  maximising eq. (7)), the threshold bisected to 1e-6 (comnum::fec::density_evolution::
  hard_decision_threshold); the crossover probability at which 1 - h(eps) equals the rate
  (eq. (3)) and the noise level at which the BIAWGN capacity (eq. (4),
  comnum::fec::bounds::biawgn_capacity) equals it.
run:
  test: validation/tests/coding/richardson2001.rs::richardson_urbanke_2001_table_1_hard_decisions_and_capacities
tier: ci
duration: "1 s"
tolerance: {atol: 0.002}
why: >
  the thresholds are printed to two or three digits, mostly rounded down (A for (3, 6)
  and B, identical for d_v = 3, are 0.0395, printed 0.04); algorithm E takes at every iteration the weight that
  maximises (7), which the paper states for (3, 6) only: (3, 5) and (3, 4) come out 0.0016
  and 0.0011 above the table. The capacity columns are printed to three digits, 0.002
  covers the 0.0016 of sigma_opt at rate 1/3.
findings:
  - "Gallager A and B (3, 6), identical for d_v = 3: 0.0395, printed 0.04 (the only entries rounded up; the other A and B entries are the measured values rounded down)"
  - "algorithm E (3, 5) and (3, 4): 0.0976 and 0.1441 against 0.096 and 0.143, with the weights of eq. (7) at every iteration; the other four within the printed digits"
  - "sigma_opt 1.2966 at rate 1/3, printed 1.295; 1.1491 at 0.4, printed 1.148; the others within 0.0005"
