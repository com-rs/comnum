id: kidorf1999_fig5
title: Power of the eight backward pumps of a 100-nm Raman amplifier along the span (Kidorf et al. 1999, Fig. 5)
literature: kidorf1999
evidence: [curve]
source:
  kind: paper
  reference: "H. Kidorf, K. Rottwitt, M. Nissov, M. Ma, E. Rabarijaona, Pump interactions in a 100-nm bandwidth Raman amplifier, IEEE Photon. Technol. Lett. 11(5), 530-532, 1999"
  locator: "Fig. 5, the eight curves read from the raster at 600 dpi at z = 0 and the maximum of the 1502 nm curve; the launch powers of Fig. 3 (bars, read); the fibre of Sec. III and the gain spectrum of Fig. 1 (read)"
  file: fiber/1999_kidorf_pump-interactions-100nm-raman-amplifier_ptl.pdf
description: >
  45 km of pure silica core fibre pumped backward by eight pumps at 1416, 1421, 1425,
  1430, 1439, 1456, 1473 and 1502 nm launched at the powers read on Fig. 3 (21.33 to
  19.44 dBm), 100 signals of -3.0 dBm from 1520 to 1619 nm every 1 nm. The gain is the
  measured spectrum of Fig. 1 (pump at 1452 nm, read every 2 nm, the axis taken in
  1/(W km)), extended beyond its 19.1 THz by the shape of standard fibre; the loss is
  0.170 dB/km at the signals (the minimum of Sec. III) and 0.170 (1563/lambda)^4 dB/km at
  the pumps (an assumption: the paper gives no loss spectrum). The curves of Fig. 5 are
  assigned to the pumps by their order at z = 0, which matches the alternation of thick
  and thin lines of the legend. Measured: the power of every pump at z = 0 (dBm), the
  spread between the 1502 and 1416 nm pumps there (the pump-to-pump transfer), and the
  maximum of the 1502 nm pump and its position.
run:
  test: validation/tests/fiber/kidorf1999.rs::kidorf_1999_fig_5_power_of_the_backward_pumps
tier: ci
duration: "0.3 s in release"
tolerance: {atol: 1.1}
why: >
  the curves are read at +-0.15 dB, and the losses are not given: in the test's model
  +-0.01 dB/km of pump loss moves the far-end powers by 0.05 to 0.41 dB and +-0.02 dB/km
  of signal loss by up to 0.35 dB; the tolerance of the far-end powers is the agreement
  obtained, 1.1 dB. The spread of the far end is read at +-0.3 dB (two curves), the
  maximum at +-0.2 dB and its position at +-3 km (the curve is within 0.1 dB of its
  maximum over 10 km)
findings:
  - "the far-end powers are 0.49 to 1.05 dB below the figure at every pump (-4.50, -2.70, -1.34, 0.58, 2.91, 5.55, 8.83 and 16.19 dBm against -4.01, -2.21, -0.29, 1.46, 3.58, 6.11, 9.44 and 16.98 read): a common deficit, not explained; the assumed pump losses explain it only in part (0.01 dB/km less loss raises them by 0.05 to 0.41 dB); with the loss 0.170 dB/km at every pump the five longest pumps come out 0.7 to 1.2 dB above the figure"
  - "the pump-to-pump transfer is reproduced: the 1502 nm pump ends 20.70 dB above the 1416 nm pump against 20.99 read (20.28 with a flat loss), and reaches 22.21 dBm at 34.25 km against 22.44 dBm at 32.6 km read"
cases:
  - {inputs: {quantity: power_at_z0_dbm, pump_nm: 1416.0}, expected: -4.01}
  - {inputs: {quantity: power_at_z0_dbm, pump_nm: 1421.0}, expected: -2.21}
  - {inputs: {quantity: power_at_z0_dbm, pump_nm: 1425.0}, expected: -0.29}
  - {inputs: {quantity: power_at_z0_dbm, pump_nm: 1430.0}, expected: 1.46}
  - {inputs: {quantity: power_at_z0_dbm, pump_nm: 1439.0}, expected: 3.58}
  - {inputs: {quantity: power_at_z0_dbm, pump_nm: 1456.0}, expected: 6.11}
