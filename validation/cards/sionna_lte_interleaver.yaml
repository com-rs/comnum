id: sionna_lte_interleaver
title: QPP interleaver of the LTE turbo code (TS 36.212, Table 5.1.3-3) against Sionna
literature: sionna
evidence: [recording]
source:
  kind: tool
  reference: "Sionna (NVIDIA, Apache-2.0), sionna.phy.fec.interleaving.Turbo3GPPInterleaver; 3GPP TS 36.212, Sec. 5.1.3.2.3 and Table 5.1.3-3"
  locator: "recorded outputs tests/oracle/sionna_interleaving.json and .npz (tests/oracle/test_scrambling_interleaving_oracle.py: the 188 pairs (f1, f2) of Sionna's table and its permutations for twelve sizes from 40 to 6144)"
  version: "2.2.0"
description: >
  comnum.Interleaver.from_name("lte", k), comnum's transcription of Table 5.1.3-3,
  against the permutation of Turbo3GPPInterleaver for twelve sizes (40, 48, 104, 512,
  1008, 1024, 2048, 3072, 4032, 5056, 6080, 6144); the test also checks, for the 188
  sizes of the table, that comnum's interleaver is the polynomial of Sionna's
  coefficients. Both write y_i = x_pi(i).
run:
  function: comnum.Interleaver.from_name
output: perm
tier: ci
duration: "0.1 s on an Apple M6"
tolerance: {exact: true}
findings:
  - "the 188 coefficient pairs of the two tables define the same permutations, and the twelve recorded permutations are the same"
cases:
  - inputs: {name: lte, k: 40}
    expected: {oracle: sionna_interleaving, path: [lte_perm, "40"]}
  - inputs: {name: lte, k: 1008}
    expected: {oracle: sionna_interleaving, path: [lte_perm, "1008"]}
  - inputs: {name: lte, k: 5056}
    expected: {oracle: sionna_interleaving, path: [lte_perm, "5056"]}
  - inputs: {name: lte, k: 6144}
    expected: {oracle: sionna_interleaving, path: [lte_perm, "6144"]}
