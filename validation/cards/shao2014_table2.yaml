id: shao2014_table2
title: Error of a single split step with the loss in the dispersion or in the nonlinearity
literature: shao2014
evidence: [table, claim]
source:
  kind: paper
  reference: "J. Shao, X. Liang, S. Kumar, Comparison of split-step Fourier schemes for simulating fiber optic communication systems, IEEE Photonics J. 6(4), 7200515, 2014"
  locator: "Table 2 (single-step error versus step size, schemes I and II, 10 and 25 Gbaud), eqs. (11), (19), (21), (43); the system of Sec. 3"
  file: fiber/2014_shao_split-step-schemes_jphot.pdf
description: >
  8192 random 32-QAM symbols shaped by a raised cosine of roll-off 0.8, at 10 and
  25 Gbaud (8 samples per symbol here; the paper's sampling, symbols and the launch power
  of the table are not given: 0 dBm), one step of h km of fibre (alpha 0.046 /km,
  |beta2| 5 ps2/km, anomalous here, gamma 2.2 /W/km) with the loss combined with the
  dispersion (scheme I, eq. (11): comnum's midpoint step) or with the nonlinearity
  (scheme II, eq. (21): the effective-length step of Optilux), against the same scheme
  with steps of 1.25 m (a nonlinear phase of about 1e-5 rad per step at the peak power)
  over the same h: the global error of eq. (43), the squared norm of the difference over
  that of the reference. The published values are copied verbatim; the cases compare the
  errors of both schemes, their ratio at equal h and the order of the error in h between
  0.5 and 1 km (6 for a symmetric scheme: h^3 on the field, squared).
run:
  test: validation/tests/fiber/shao2014.rs::shao_2014_table_2_single_step_errors
tier: campaign
duration: "about 3 minutes on an Apple M6 (release; four references of 48 000 steps)"
tolerance: {factor: 5.0}
why: >
  the agreement obtained. The single-step error scales with the fourth moment of the
  field (eq. (13)) and the random symbols, the sampling and the launch power of the
  table are not given: scheme I is reproduced within 12 % at 10 Gbaud and a factor 2.7
  at 25 Gbaud. Scheme II as eq. (21) writes it (comnum's effective-length step, which
  reproduces Optilux's fields to the arithmetic) has 2.0 times less error than the
  table at 10 Gbaud at every step and 2 to 4.9 times less at 25 Gbaud: a gap that is
  not explained, hence 5 on the errors and 3 on the ratios of the schemes (the ratios
  are 2.1 to 2.8 times the table's); the orders in h are those of the table within 0.06
findings:
  - "scheme I (the midpoint step, eq. (11)): 1.44e-15 to 3.30e-4 against 1.29e-15 to 3.07e-4 at 10 Gbaud (within 12 % at every step), 3.75e-15 to 4.04e-4 against 5.38e-15 to 4.14e-4 at 25 Gbaud (a factor 1.1 to 2.7, the largest at 5 to 20 km); both orders in h between 0.5 and 1 km are 5.94 to 5.97 against 5.96 to 5.98 (h^6 on the squared norm: a third-order local error)"
  - "scheme II as eq. (21) writes it (the effective-length step of comnum and of Optilux's fiber, identical fields to 1e-28): 1.82e-17 to 4.68e-6 at 10 Gbaud, 2.0 times below the table's 3.43e-17 to 9.79e-6 at every step (the ratio I/II is 70 to 81 here, 31 to 38 in the table); 2.36e-15 to 1.63e-4 at 25 Gbaud, 2.0 to 4.9 times below the table's 4.69e-15 to 4.34e-4 (I/II 1.6 to 2.5 here, 0.82 to 1.22 in the table: the table's scheme II is worse than scheme I from 40 km, comnum's never is). Not explained: eq. (21) is what comnum applies (the phase of the power after a lossless half step of dispersion over h_eff, the loss of the step after it)"
  - "a hypothesis tested and rejected: scheme II with the power at the start of the step (|A(z)|^2 before the half dispersion) has 100 times more error than the table at 0.5 km (1.5e-13 against 3.43e-17 at 10 Gbaud) and a lower order: the table's scheme II is not that"
  - "the sign of beta2, which the paper does not give: scheme I differs by 5 % between the two signs, scheme II by 7 to 20 % (anomalous dispersion gives the smaller error); the cases take the anomalous sign"
  - "the reference, steps of 1.25 m, has a nonlinear phase of 7.8e-6 rad per step at the peak power of 2.85 mW (the paper: 1e-5 rad)"
