id: semrau2019_fig4a
title: The closed form of the ISRS GN model after one span against the channel frequency (Semrau, Killey & Bayvel, Fig. 4a)
literature: semrau2019
evidence: [curve]
source:
  kind: paper
  reference: "D. Semrau, R. I. Killey, P. Bayvel, A closed-form approximation of the Gaussian noise model in the presence of inter-channel stimulated Raman scattering, J. Lightw. Technol. 37(9), 1924-1936, 2019 (arXiv 1808.07940v2)"
  locator: "Fig. 4a, the dashed (closed-form) curves without ISRS, at 0 dBm/ch. and at 2 dBm/ch., read from the vector paths at -5, -4.8, -4, -2.4, 0, 2.4, 4, 4.8 and 5 THz (0.02 dB); Table I; eqs. (5), (10), (11)"
  file: fiber/2019_semrau_closed-form-gn-isrs_jlt_arxiv.pdf
description: >
  The link of Table I: 251 channels of 40 GBd (roll-off 0.01 %) on a 40.005 GHz grid
  around 1550 nm, one span of 100 km of SMF (0.2 dB/km, D = 17 ps/nm/km,
  S = 0.067 ps/nm^2/km, gamma = 1.2 /W/km), the Raman gain slope C_r = 0.028 /W/km/THz
  (0 for the curve without ISRS). The NLI coefficient eta_1 (dB, 1/W^2) of the channel
  nearest to each frequency by isrs_closed_form_eta: the SPM of eq. (10) without its
  last term plus the XPM of eq. (11) summed over the 250 other channels, one span.
run:
  test: validation/tests/fiber/semrau2019.rs::the_closed_form_of_eta_1_follows_the_dashed_curves_of_fig_4a
tier: ci
duration: "milliseconds"
tolerance: {atol: 0.3}
why: >
  the curves are read to 0.02 dB; the last term of eq. (10) is ambiguous in the preprint
  (B_i^2/(9 alpha^2), not dimensionless) and is left out: the SPM is 9 to 10 dB below
  the XPM at every channel, so an uncertainty of a factor two on it moves the total by
  up to 0.3 dB, which is also the size of the gap between the paper's own closed form
  and its integration at the edges; wider at the band edges (notes)
findings:
  - "without ISRS the closed form is within 0.12 dB of the dashed curve from -4.8 to 5 THz (-0.11 at -4.8, -0.02 to +0.12 from -4 to 4.8, -0.08 at 5 THz) and within 0.04 dB of the paper's integration curve from -2.4 to 4 THz (30.13 against 30.17 dB at 0 THz, where the paper's own closed form reads 30.04)"
  - "with ISRS the gap grows from the low- to the high-frequency edge: +0.11 to +0.15 dB from -4.8 to 0 THz and -0.07 to -0.35 from 4 to 5 THz at 0 dBm/ch.; +0.21 to +0.25 from -4.8 to -2.4 THz, +0.10 at 0, -0.20 at 4, -0.34 at 4.8 and -0.51 dB at 5 THz at 2 dBm/ch., where T_i = 0.84 and 0.79 and the asinh term of eq. (10) nearly vanishes (the SPM falls to 10.0 and 8.5 dB); the term of eq. (10) left out, placed where it is dimensionally consistent (outside the bracket, 16 gamma^2/(243 alpha^2)), would lift every curve by about 0.6 dB"
  - "at -5 THz the paper's dashed curves are not consistent with their own markers: they lie 0.42 (no ISRS), 0.29 (0 dBm) and 0.03 dB (2 dBm) above the simulation markers of the edge channel and drop by 0.5 dB from -4.8 THz, where the markers drop by 1.1 dB, as does the closed form (which loses the five interferers below the channel); the closed form is 0.70, 0.49 and 0.38 dB below the readings at -5 THz and 0.28, 0.20 and 0.35 dB below the markers"
  - "delta rho of eq. (3) with Table I is 6.5 dB at 0 dBm/ch. and 10.4 dB at 2 dBm/ch.; the text says 6.3 and 10.3 dB"
  - "the integration curves are not reproduced with GnModel: on this spectrum its grid is about 10 MHz over 10 THz (the width alpha/(4 pi^2 |beta2| 5 THz) of the link function of the far pairs), 10^6 nodes and 5 10^11 cells for one channel, and the ISRS profiles multiply the cost of a cell; not run (see not_covered)"
