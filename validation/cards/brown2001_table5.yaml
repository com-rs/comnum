id: brown2001_table5
title: The 95 % limits of the Jeffreys interval of a binomial proportion
literature: brown2001
evidence: [table]
source:
  kind: paper
  reference: "L. D. Brown, T. T. Cai, A. DasGupta, Interval estimation for a binomial proportion, Statistical Science 16(2), 101-133, 2001"
  locator: "Table 5, eqs. (6)-(8)"
  file: simulation/2001_brown_interval-estimation-binomial-proportion_statsci.pdf
description: >
  The equal-tailed Jeffreys interval of x successes among n trials, the 2.5 % and 97.5 %
  quantiles of Beta(x + 1/2, n - x + 1/2) (0 at x = 0), by
  comnum::sim::stats::ErrorRate::interval(BinomialInterval::Jeffreys, 0.95), for
  7 <= n <= 30 and x = 0 to ceil(n/2) (the other half by symmetry): the 252 pairs of
  limits of Table 5. The quantiles come from comnum_math::beta_inv (bisection on the
  regularized incomplete beta function).
run:
  test: validation/tests/simulation/brown2001.rs::brown_cai_dasgupta_2001_table_5_jeffreys_limits
tier: ci
duration: "under a second"
tolerance: {atol: 1.0e-3}
why: "Table 5 prints three decimals; a rounding tolerance of 5e-4 is not enough (see findings), so the cases allow one unit of the last printed digit"
findings:
  - "485 of the 504 limits agree with the printed value to its rounding (5e-4); the other 19 differ by one unit of the third decimal, at most 5.5e-4 (n = 24, x = 6: 0.44455 printed 0.444; n = 12, x = 4: 0.12454 printed 0.124; n = 27, x = 9: 0.17946 printed 0.180). The beta quantiles of comnum agree with SciPy's betaincinv to 1e-14 (comnum_math::beta_inv), so the printed values carry a slightly less accurate quantile; the cases allow one unit of the last digit"
  - "Table 5 has 252 pairs (x = 0 to ceil(n/2) for n = 7 to 30), all compared"
