id: biguesh2006
title: Training-based MIMO channel estimation, LS, scaled LS, LMMSE and relaxed MMSE
literature: biguesh2006
evidence: [closed_form, curve]
source:
  kind: paper
  reference: "M. Biguesh, A. B. Gershman, Training-based MIMO channel estimation: a study of estimator tradeoffs and optimal training signals, IEEE Trans. Signal Process. 54(3), 884-893, 2006"
  locator: "Figs. 1-5, eqs. (12), (20), (28), (41), (49), (59)"
  file: mimo/2006_biguesh_training-mimo-channel-estimation_tsp.pdf
description: >
  The estimators of comnum::mimo::estimation on S = H P + V with N = t training symbols,
  unit noise variance, rows of H independent of covariance [eps^|n-m|] (R_H = r
  [eps^|n-m|], eq. (60)), the abscissa P/sigma^2 in dB, the MSE normalised by r t, 5000
  channels per point: LS with the DFT training of eq. (10) (Fig. 1, r = 3), SLS and
  LS-SLS (Fig. 2, r = 3), the LMMSE with orthogonal and water-filled training (Fig. 3, r
  = 3, eps = 0.4 and 0.8), LS, SLS, RMMSE and LMMSE at eps = 0.8 for t = r = 2 and 8
  (Fig. 4), the BLUE of K = 1, 2, 4 LS estimates (eq. (59), r = 2, t = 4). Each point is
  compared three ways: the Monte Carlo against the figure, the closed form of
  Training::mse against the paper's equation, and the Monte Carlo against the closed
  form. eps is not given for Figs. 1, 2 and 5: 0.
run:
  test: validation/tests/mimo/biguesh2006.rs::biguesh_2006_figs_1_to_5
tier: ci
duration: "about a second (debug)"
tolerance: {factor: 1.12}
why: "the figures are 600-dpi scans read on their log grid, 0.02 decade for an isolated marker and 0.05 where markers merge, plus the Monte Carlo (under 2 %)"
findings:
  - "121 readings of Figs. 1-4 within 7.4 % of the Monte Carlo (LS within 4.7 %, SLS and RMMSE 7.4 %, LS-SLS 4.0 %, LMMSE 6.6 %); the Monte Carlo within 1.9 % of Training::mse at 117 points; Training::mse equal to eqs. (12), (20), (28), (41), (49) and (59) evaluated independently on the card (1e-9)"
  - "the abscissa P/sigma^2 is in dB: the paper prints no unit, and Fig. 1 follows eq. (12) only in dB"
  - "LS-SLS (eq. (17)) does not depend on eps within 1 % (1.464 at 1 dB, t = 5, eps = 0, against 1.457 with eps = 0.8; read 1.48): eps = 0 for Figs. 1, 2 and 5, which do not give it"
  - "Fig. 4, t = r = 2, left out at low SNR: SLS and RMMSE read 0.59 at 3 dB and 0.38 at 6 dB against 0.501 and 0.333 by the Monte Carlo and 0.501 and 0.334 by eq. (20) (+18 % and +14 %), the LMMSE 0.45 at 3 dB against 0.409 and 0.405 by eq. (28) (+11 %); the same estimators at t = 2 in Fig. 2 and at t = r = 8 follow the equations, so the figure, not the estimator, departs from the paper's closed forms (not explained)"
  - "Fig. 5 is not compared with its readings: K = 1 (plain LS) reads 2.45 at 3 dB against 2.00 by eq. (12) and by Fig. 1, and the ratios between the curves are about 4.6 and 2.6 instead of the 2 and 2 of eq. (59) with equal powers; the per-period powers and the meaning of the abscissa are not given. Eq. (59) is checked instead, by Monte Carlo within 1 % for K = 1, 2, 4"
