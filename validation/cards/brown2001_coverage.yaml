id: brown2001_coverage
title: Exact coverage of the Wald and Wilson intervals of a binomial proportion
literature: brown2001
evidence: [table]
source:
  kind: paper
  reference: "L. D. Brown, T. T. Cai, A. DasGupta, Interval estimation for a binomial proportion, Statistical Science 16(2), 101-133, 2001"
  locator: "Tables 1-3, Sec. 1, Examples 1 and 5, Sec. 3.2, Sec. 3.3 (Fig. 8), Sec. 4.1.1"
  file: simulation/2001_brown_interval-estimation-binomial-proportion_statsci.pdf
description: >
  The exact coverage C(p, n) of the Wald interval (eq. (1)) and of the Wilson interval
  (eq. (4)) for X ~ Bin(n, p), by comnum::sim::stats::coverage: Table 1 (p = 0.5), Table 2
  and Sec. 1 (p = 0.005 to n = 1876; n = 100), Example 1 (p = 0.2), Example 5 (99 %,
  n = 20, the average over p by the midpoint rule on 20 000 points). The limits as
  n -> infinity with np = gamma, where X becomes Poisson(gamma): the bound of eq. (3)
  (Table 3), the infimum of the coverage over gamma >= 1, 5, 10 (Sec. 3.2) and the spikes
  of the Wilson interval (Sec. 4.1.1), computed in the test from the Poisson law and the
  limiting intervals. The values of p where the shortest expected length changes at
  n = 25 (Sec. 3.3, Fig. 8), by comnum::sim::stats::expected_length and bisection.
run:
  test: validation/tests/simulation/brown2001.rs::brown_cai_dasgupta_2001_coverage_of_the_wald_and_wilson_intervals
tier: ci
duration: "a few seconds"
tolerance: {atol: 5.0e-4}
why: "the paper prints three decimals of exact probabilities"
findings:
  - "the 30 coverages of the Wald interval (Tables 1-2, Sec. 1, Examples 1 and 5) agree with the printed values to their rounding: the summation and eq. (1) are those of the paper (closed interval, untruncated)"
  - "Table 3 prints 0.875 at gamma = 5; eq. (3) gives 0.8699, and Sec. 3.2 quotes 0.870 for the same limit: a misprint of the table"
  - "Sec. 1 gives C(0.5, 17) = 0.953 and Table 1 0.951; the sum gives 0.95096, the table's value"
  - "Sec. 3.2 quotes 0.860 for the limiting infimum of the Wald coverage over gamma >= 1; the Wald interval of X = 0 is the point 0, so the coverage of gamma = np is at most 1 - e^{-gamma} = 0.632 at gamma = 1 (eq. (3) gives 0.6315, and so does the infimum computed here): not compared"
  - "the limiting infima of the Wilson coverage over gamma >= 5 and >= 10 are 0.9349 and 0.9361 here, 0.0011 and 0.0019 below the paper's 0.936 and 0.938, also on a grid of gamma of step 0.01 (0.9351, 0.9362): not explained; over gamma >= 1, 0.9159 rounds to the printed 0.92, and the spikes of Sec. 4.1.1 (0.8382, 0.8892) agree"
  - "the crossing at p = 0.133 of Fig. 8 is reproduced with the untruncated Wald interval (0.1331); truncating it to [0, 1] shortens it near p = 0 and moves the crossing to 0.176: comnum returns the Wald and Agresti-Coull intervals untruncated, as the paper defines them"
