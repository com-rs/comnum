    expected: {max: 0.2}
    note: "Table 5.2.2.1.1-3: 70 % of the maximum throughput at 0.2 dB, a minimum performance (the SNR of a conformant receiver is at most this)"
  - inputs: {test: "1-2", antennas: 2x4, quantity: snr_70_db}
    expected: {max: -2.9}
    note: "Table 5.2.3.1.1-3: 70 % at -2.9 dB with 4 receive antennas"
  - inputs: {test: "1-2", antennas: 2x2, quantity: snr_70_db, reference: company 4}
    expected: -1.8
    tolerance: {atol: 0.3}
    why: "company 4 prints -1.8 dB (-1.84 on its curve); 0.3 dB: the 0.1 dB of the print, the Monte Carlo (3800 slots, 0.8 % of throughput, about 0.1 dB) and the receivers (MMSE-IRC there, maximum ratio here)"
  - inputs: {test: "1-2", antennas: 2x4, quantity: snr_70_db, reference: company 4}
    expected: -4.9
