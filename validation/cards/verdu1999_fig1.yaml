id: verdu1999_fig1
title: Large-system spectral efficiency of DS-CDMA with random signatures (Verdu & Shamai 1999, eqs. (9)-(12) and Fig. 1)
literature: verdu1999
evidence: [closed_form, table, curve]
source:
  kind: paper
  reference: "S. Verdu, S. Shamai (Shitz), Spectral efficiency of CDMA with random spreading, IEEE Trans. Inf. Theory 45(2), 622-640, 1999"
  locator: "eqs. (9) (optimum), (10) (single-user matched filter), (11) (decorrelator) and (12) (MMSE) of Sec. I-C, evaluated at SNR = 10 dB; the limit of the matched filter at a large load printed after eq. (10); Fig. 1 (Eb/N0 = 10 dB), read on its grid"
  file: multiple-access/1999_verdu_spectral-efficiency-cdma-random-spreading_tit.pdf
run:
  function: comnum.cdma_spectral_efficiency
tolerance: {rtol: 1.0e-9}
why: "closed forms evaluated with 15 digits (numpy) against the same equations in comnum; the cases read on Fig. 1 and the limits have their own tolerance"
findings:
  - "at Eb/N0 = 10 dB the decorrelator peaks at 1.25 bit/chip near K/N = 0.65 and the MMSE receiver at 1.36 near 0.75, as on Fig. 1; the conventional receiver reaches 0.54 at K/N = 2 and tends to 0.671, the optimum receiver 2.68 at K/N = 2"
cases:
  - {inputs: {load: 0.5, receiver: mr, snr_db: 10.0}, expected: 0.3537593748, note: "eq. (10)"}
  - {inputs: {load: 1.0, receiver: mr, snr_db: 10.0}, expected: 0.4664429021, note: "eq. (10)"}
  - {inputs: {load: 2.0, receiver: mr, snr_db: 10.0}, expected: 0.5618788876, note: "eq. (10)"}
  - {inputs: {load: 0.5, receiver: mmse, snr_db: 10.0}, expected: 0.6882758277, note: "eq. (12)"}
  - {inputs: {load: 1.0, receiver: mmse, snr_db: 10.0}, expected: 0.9440671199, note: "eq. (12)"}
  - {inputs: {load: 2.0, receiver: mmse, snr_db: 10.0}, expected: 0.8830645640, note: "eq. (12)"}
  - {inputs: {load: 0.5, receiver: optimal, snr_db: 10.0}, expected: 0.7813317640, note: "eq. (9)"}
  - {inputs: {load: 1.0, receiver: optimal, snr_db: 10.0}, expected: 1.3616632329, note: "eq. (9)"}
  - {inputs: {load: 2.0, receiver: optimal, snr_db: 10.0}, expected: 2.0056794370, note: "eq. (9)"}
  - {inputs: {load: 0.5, receiver: zf, ebn0_db: 10.0}, expected: 1.1446199553, tolerance: {rtol: 1.0e-8}, why: "eq. (11): beta C*((1 - beta) Eb/N0), the single-user efficiency C* solved from (4^C - 1)/(2C) = Eb/N0 by scipy.optimize.brentq", note: "eq. (11)"}
  - {inputs: {load: 1.0, receiver: zf, ebn0_db: 10.0}, expected: 0.0, tolerance: {atol: 1.0e-12}, why: "eq. (11): no efficiency at K = N", note: "eq. (11)"}
  - {inputs: {load: 2000.0, receiver: mr, ebn0_db: 10.0}, expected: 0.6713, tolerance: {atol: 1.0e-3}, why: "the limit log2(e)/2 - N0/(2 Eb) of the text after eq. (10), reached at an infinite load: 2000 is within 1e-3", note: "limit after eq. (10)"}
  - {inputs: {load: 0.65, receiver: zf, ebn0_db: 10.0}, expected: 1.25, tolerance: {atol: 0.07}, why: "read on Fig. 1 (the maximum of the decorrelator curve), a grid of 0.5 bit/chip: about 0.05", note: "Fig. 1"}
  - {inputs: {load: 0.75, receiver: mmse, ebn0_db: 10.0}, expected: 1.35, tolerance: {atol: 0.07}, why: "read on Fig. 1 (the maximum of the MMSE curve), a grid of 0.5 bit/chip: about 0.05", note: "Fig. 1"}
  - {inputs: {load: 2.0, receiver: mmse, ebn0_db: 10.0}, expected: 0.9, tolerance: {atol: 0.07}, why: "read on Fig. 1 at K/N = 2, a grid of 0.5 bit/chip: about 0.05", note: "Fig. 1"}
  - {inputs: {load: 2.0, receiver: mr, ebn0_db: 10.0}, expected: 0.55, tolerance: {atol: 0.07}, why: "read on Fig. 1 at K/N = 2, a grid of 0.5 bit/chip: about 0.05", note: "Fig. 1"}
  - {inputs: {load: 1.0, receiver: optimal, ebn0_db: 10.0}, expected: 2.2, tolerance: {atol: 0.07}, why: "read on Fig. 1 at K/N = 1, a grid of 0.5 bit/chip: about 0.05", note: "Fig. 1"}
