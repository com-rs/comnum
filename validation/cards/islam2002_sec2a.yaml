id: islam2002_sec2a
title: The noise figure of a fully inverted Raman amplifier (Islam 2002, Sec. II-A)
literature: islam2002
evidence: [closed_form]
source:
  kind: paper
  reference: "M. N. Islam, Raman amplifiers for telecommunications, IEEE J. Sel. Topics Quantum Electron. 8(3), 548-559, 2002"
  locator: "Sec. II-A, text: S_ase = (G - 1) h nu N2/(N2 - N1) per polarisation with N2/(N2 - N1) = 1 for Raman, NF = (2 S_ase/(h nu) + 1)/G"
  file: fiber/2002_islam_raman-amplifiers-telecommunications_jstqe.pdf
description: >
  A lossless fibre of 10 km co-pumped at 1450 nm without pump loss by an undepleted
  pump (signal of 1 nW at 1550 nm) whose power gives a net gain G of 10, 20 and 30 dB:
  the noise figure of the span (RamanProfile::noise_figure_db, Bromage 2004 eq. (9) with
  the spontaneous noise of the solver) against the closed form of a fully inverted
  amplifier, NF = 2 - 1/G, at a temperature where the phonon occupancy vanishes
  (10^-3 K), and NF = (1 + eta) 2 (G - 1)/G + 1/G at 300 K, eta = 1/(exp(h df/(k T)) - 1)
  of the 13.3 THz pump-signal offset (0.134).
run:
  test: validation/tests/fiber/islam2002.rs::islam_2002_sec_2a_noise_figure_of_a_fully_inverted_amplifier
tier: ci
duration: "milliseconds"
tolerance: {atol: 1.0e-3}
why: "a closed form; the trapezoids of the spontaneous integral on a grid of 10 m (1.7e-5 dB at 30 dB; 1.8e-3 dB on the default grid of 100 m)"
findings:
  - "the spontaneous noise of the solver per polarisation is (G - 1) h nu (1 + eta) in the lossless undepleted case, Islam's S_ase with the thermal factor of Bromage 2004 eq. (6): the 3 dB quantum limit is reached at high gain and 0 K"
cases:
  - {inputs: {gain_db: 10, temperature_k: 1.0e-3}, expected: 2.787536}
  - {inputs: {gain_db: 20, temperature_k: 1.0e-3}, expected: 2.988531}
  - {inputs: {gain_db: 30, temperature_k: 1.0e-3}, expected: 3.008128}
  - {inputs: {gain_db: 10, temperature_k: 300}, expected: 3.307558}
  - {inputs: {gain_db: 20, temperature_k: 300}, expected: 3.533111}
  - {inputs: {gain_db: 30, temperature_k: 300}, expected: 3.555035}
