id: semrau2019_fig5
title: The closed form after 6 x 100 km, coherent and incoherent accumulation, without and with ISRS (Semrau, Killey & Bayvel, Fig. 5)
literature: semrau2019
evidence: [curve, claim, closed_form]
source:
  kind: paper
  reference: "D. Semrau, R. I. Killey, P. Bayvel, A closed-form approximation of the Gaussian noise model in the presence of inter-channel stimulated Raman scattering, J. Lightw. Technol. 37(9), 1924-1936, 2019 (arXiv 1808.07940v2)"
  locator: "Fig. 5, the dashed closed-form curves, coherent (epsilon = 0.15) and incoherent, of panels (a) without and (b) with ISRS, read from the vector paths at -4.8, -4, -2.4, -0.8, 0, 0.8, 2.4, 4, 4.8 and 5 THz (0.02 dB; the curves are drawn from -4.8 THz); Sec. III-A (epsilon = 0.15 by Poggiolini 2012 eq. (22) over the channel bandwidth; the incoherent form 0.2 dB below on average); eq. (5)"
  file: fiber/2019_semrau_closed-form-gn-isrs_jlt_arxiv.pdf
description: >
  The link of Table I over 6 spans of 100 km at 0 dBm/ch. (see semrau2019_fig4a), C_r =
  0 in panel (a) and 0.028 /W/km/THz in panel (b). The NLI coefficient eta_6 (dB) of eq.
  (5): the SPM of eq. (10) times 6^(1 + epsilon) with epsilon = 0.15 (coherent) or 0
  (incoherent), plus the XPM of eq. (11) times 6. The claim: the mean over the ten
  frequencies of the card of the coherent minus the incoherent form, per panel. The
  closed form: epsilon of Poggiolini 2012 eq. (22) over 40.004 GHz (coherence_factor)
  against the 0.15 of Sec. III-A.
run:
  test: validation/tests/fiber/semrau2019.rs::the_accumulation_over_six_spans_follows_the_dashed_curves_of_fig_5
tier: ci
duration: "milliseconds"
tolerance: {atol: 0.35}
why: >
  the curves are read to 0.02 dB; the SPM term left out of eq. (10) (see
  semrau2019_fig4a) weighs 6^0.15 = 1.3 times more in the coherent form; the claim is a
  range around "0.2 dB on average"; epsilon to the two digits printed; wider at the
  high-frequency edge under ISRS (notes)
findings:
  - "without ISRS (a) the coherent form is within 0.17 dB of the dashed curve from -4 to 4.8 THz (-0.17 at -4, -0.07 at -2.4, +0.01 to +0.10 from -0.8 to 4, 0.00 at 4.8), -0.32 dB at -4.8 THz and -0.24 at 5 THz; the incoherent form within 0.15 dB from -4 to 4.8 THz, -0.30 at -4.8 and -0.23 at 5 THz"
  - "with ISRS (b) the gap grows towards the high-frequency edge as in Fig. 4a: +0.09 to +0.17 dB from -4.8 to -2.4 THz, within 0.07 from -0.8 to 0.8, -0.13 at 2.4, -0.28 at 4, -0.46 at 4.8 and -0.74 dB at 5 THz (coherent; the incoherent form within 0.06 dB of these gaps)"
  - "the coherent form exceeds the incoherent one by 0.175 dB (a) and 0.157 dB (b) on average over the ten frequencies, the paper's own dashed curves by 0.19 and 0.18 dB: the 0.2 dB of Sec. III-A"
  - "epsilon of Poggiolini 2012 eq. (22) over the channel bandwidth of 40.004 GHz, 6 spans of 100 km: 0.1512, the 0.15 of Sec. III-A"
cases:
