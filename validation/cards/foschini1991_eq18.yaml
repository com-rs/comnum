id: foschini1991_eq18
title: The rms DGD grows as the square root of the length (Foschini and Poole, eq. (18))
literature: foschini1991
evidence: [closed_form]
source:
  kind: paper
  reference: "G. J. Foschini, C. D. Poole, Statistical theory of polarization dispersion in single mode fibers, J. Lightw. Technol. 9(11), 1439-1456, 1991"
  locator: "eq. (18) in the regime sigma^2 l >> 1 (E tau^2 = 2 Delta'^2 l / sigma^2), Fig. 1"
  file: fiber/1991_foschini_statistical-theory-polarization-dispersion_jlt.pdf
description: >
  4000 links of 1, 2 and 4 spans of 80 km drawn by PmdLink::random with a PMD parameter
  of 0.1 ps per sqrt(km) and 20 sections per span: the mean DGD over the PMD parameter
  times the square root of the length (1 for the definition of the parameter on the mean
  DGD), and the rms DGD over that of one span (sqrt(2) and 2 for a square-root growth).
run:
  test: validation/tests/fiber/foschini1991.rs::the_rms_dgd_grows_as_the_square_root_of_the_length
tier: campaign
duration: "0.1 s on an Apple M6 (release)"
why: >
  4000 links leave 0.7 % of standard error on the mean DGD and 1.3 % on the rms; the
  ratio of two rms values has about 2 %
findings:
  - "the mean DGD of PmdLink::random over 80, 160 and 320 km is 1.000, 1.007 and 1.013 times the PMD parameter times the square root of the length; the rms grows by 1.425 and 2.027 from 1 to 2 and 4 spans (sqrt(2) and 2): the random walk of eq. (18) in the regime sigma^2 l >> 1"
cases:
  - {inputs: {quantity: mean_over_pmd_sqrt_length, spans: 1}, expected: 1.0, tolerance: {rtol: 0.03}}
  - {inputs: {quantity: mean_over_pmd_sqrt_length, spans: 2}, expected: 1.0, tolerance: {rtol: 0.03}}
  - {inputs: {quantity: mean_over_pmd_sqrt_length, spans: 4}, expected: 1.0, tolerance: {rtol: 0.03}}
  - {inputs: {quantity: rms_ratio, spans: "2 over 1"}, expected: 1.4142, tolerance: {rtol: 0.05}}
  - {inputs: {quantity: rms_ratio, spans: "4 over 1"}, expected: 2.0, tolerance: {rtol: 0.05}}
