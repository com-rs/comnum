id: goldsmith1997_adaptive_mqam
title: Capacity and adaptive MQAM in Rayleigh fading, region durations and estimation error
literature: goldsmith1997
evidence: [table, curve]
source:
  kind: paper
  reference: "A. J. Goldsmith, S.-G. Chua, Variable-rate variable-power MQAM for fading channels, IEEE Trans. Commun. 45(10), 1218-1230, 1997"
  locator: "Fig. 3 (eqs. (7), (25)), Fig. 5 (eqs. (31)-(32)), Table II (eqs. (34)-(35)), Fig. 10 (eq. (42)); figures read on the raster"
  file: modulation/1997_goldsmith_variable-rate-variable-power-mqam_tcom.pdf
description: >
  The closed forms of comnum::mapping::link_adaptation over Rayleigh fading: the capacity
  with water-filling in time and continuous-rate adaptive MQAM at 1e-3 and 1e-6 (Fig. 3),
  the five-region discrete rate {0, 2, 4, 16, 64} and the continuous rate at 1e-3 (Fig. 5),
  the threshold gamma_K* of eq. (32) and the average fade region durations at 10 and
  20 dB with f_D = 100 Hz (Table II), and the BER under a constant SNR estimation error
  (Fig. 10).
run:
  test: validation/tests/modulation/goldsmith1997.rs::goldsmith_chua_1997_figs_3_5_10_and_table_ii
tier: ci
duration: "under 1 ms"
tolerance: {atol: 0.05}
why: >
  the curves are read on the raster to about 0.05 bit/s/Hz; Table II is printed to three
  digits (1.5 % covers the 20 dB column, which recomputes 1.3 % off at most); gamma_K* is
  printed to four digits
findings:
  - "Fig. 3: the MQAM curves lie 0.1 to 0.15 bit/s/Hz below eq. (25) from 5 to 15 dB, while the continuous curve of Fig. 5 (the same quantity at 1e-3) agrees with eq. (25) within 0.05"
  - "Table II at 20 dB: regions 0 to 3 recompute 0.745, 0.304, 1.07 and 2.25 ms against 0.737, 0.301, 1.06 and 2.28 (1 to 1.3 %), not removed by moving gamma_K*; the 10 dB column is exact"
  - "Fig. 6: the top tick of the BER axis reads 10^2 for 10^-2; after eq. (26), 'R/B < 4' is most likely M < 4"
