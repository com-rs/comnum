id: proakis2008_rake
title: Simulated BER of a rake receiver over three Rayleigh paths against maximal-ratio combining
literature: proakis2008
evidence: [closed_form]
source:
  kind: paper
  reference: "J. G. Proakis, M. Salehi, Digital Communications, 5th ed., McGraw-Hill, 2008"
  locator: "eq. (13.4-15): the error rate of BPSK with maximal-ratio combining of L Rayleigh branches of equal mean SNR (comnum_mapping::theory::ber_rayleigh_mrc); a rake receiver is such a combiner when the code resolves the paths (the textbook is not in references/: the formula is quoted)"
description: >
  One user with BPSK on the m-sequence of 127 chips, over three paths delayed by 0, 2
  and 5 chips, each a circular Gaussian gain of mean power 1/3 constant over a burst of
  20 symbols; complex white Gaussian noise at a total Eb/N0 of 5 and 10 dB; 20 000
  bursts per point (seed 1958). The rake receiver (Dsss::rake) knows the gains and
  combines the first one, two or three paths. Measured: the ratio of the simulated bit
  error rate to that of maximal-ratio combining of as many Rayleigh branches at a
  third of the Eb/N0 each.
run:
  test: validation/tests/mimo/dsss.rs::a_rake_receiver_over_rayleigh_paths_has_the_error_rate_of_maximal_ratio_combining
tier: ci
duration: "3 s on an Apple M6"
tolerance: {rtol: 0.08}
why: >
  400 000 symbols in 20 000 fading states: the error count of the three fingers at
  10 dB is about 850, and the errors come in bursts of 20 symbols that share a
  channel, a relative standard deviation of about 5 %; the paths that a finger does
  not take leak through the off-peak autocorrelation of the code (1/127 of the peak),
  below the noise at these Eb/N0. The tolerance covers the agreement obtained.
findings:
  - "one, two and three fingers give the error rates of one, two and three Rayleigh branches within 5 % at 5 and 10 dB (1.4e-1, 5.5e-2, 2.3e-2 at 5 dB; 6.1e-2, 1.1e-2, 2.1e-3 at 10 dB)"
cases:
  - {inputs: {fingers: 1, ebn0_db: 5.0}, expected: 1.0}
  - {inputs: {fingers: 2, ebn0_db: 5.0}, expected: 1.0}
  - {inputs: {fingers: 3, ebn0_db: 5.0}, expected: 1.0}
  - {inputs: {fingers: 1, ebn0_db: 10.0}, expected: 1.0}
  - {inputs: {fingers: 2, ebn0_db: 10.0}, expected: 1.0}
  - {inputs: {fingers: 3, ebn0_db: 10.0}, expected: 1.0}
