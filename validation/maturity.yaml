- theme: Coding and shaping
  name: "Density evolution of LDPC ensembles"
  modules: "`comnum_fec::density_evolution`"
  summary: "Richardson & Urbanke 2001 Tables I-II"
  python: false
  evidence:
    - table: "card [`richardson2001_table1`](../validation/cards/richardson2001_table1.yaml): the thresholds of Gallager's algorithms A, B and of algorithm E on the BSC for six regular ensembles (Richardson & Urbanke, *IEEE Trans. Inf. Theory* 47(2), 2001, Table I), 14 of 18 within the rounding of the table, the four others within 0.002, and the capacity columns of eqs. (3)-(4) within 0.002"
    - table: "card [`richardson2001_bp`](../validation/cards/richardson2001_bp.yaml): the thresholds of belief propagation on the BIAWGN channel (Table II) and the BSC (Table I), all twelve within the rounding of the tables (a campaign of five minutes)"
    - curve: "card [`mackay1999`](../validation/cards/mackay1999.yaml): the zero of the correction effect of eq. (57) within 1.6 % of Fig. 6(b), the BP transitions of the BSC inside the brackets of Fig. 6, and the BER of PEG codes of length 504 and 1008 within a factor 1.4 of Fig. 11 (MacKay, *IEEE Trans. Inf. Theory* 45(2), 1999)"
    - self: "`crates/comnum-fec/src/density_evolution.rs::the_grid_operations_keep_the_mass_and_the_density_symmetry`, `::bp_density_evolution_converges_well_below_the_threshold_only`"
  gaps: "• regular ensembles only (the irregular ensemble of Sec. V is not computed)<br>• no binary-input Laplace channel (Table III)<br>• the finite-length curves of Figs. 5-6 are not compared with `comnum_fec::ldpc`<br>• no Python binding"
- theme: Coding and shaping
  name: "EXIT charts of parallel concatenated codes"
  modules: "`comnum_fec::exit`"
  summary: "ten Brink 2001 Tables II and IV"
  python: false
  evidence:
    - table: "card [`tenbrink2001_pinch_off`](../validation/cards/tenbrink2001_pinch_off.yaml): the pinch-off limits of rate-1/2 PCCs (ten Brink, *IEEE Trans. Commun.* 49(10), 2001, Table IV), the diagonal and the pairs with C2 within 0.02 dB, C2/C1 0.12 dB above; the (037, 021) turbo code 0.494 against 0.53 dB (Table II); a campaign of 30 minutes"
    - self: "`crates/comnum-fec/src/exit.rs` unit tests: J and its inverse, the mutual information of consistent Gaussian LLRs"
