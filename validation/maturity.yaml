# The maturity of the modules of comnum: for every module a user sees, its level, the
# strongest evidence in a few words, the tests that give the evidence and the regimes not
# covered yet. `python tools/maturity_table.py` renders docs/MATURITY.md, the table of
# README.md and docs/python/maturity.rst from this file; `--check` (run by `just check`)
# fails if one of them is out of date.
#
# theme:    one of the themes of the documentation, in the order of a link;
# name:     the module as docs/MATURITY.md titles it; short: the name of the short tables;
# modules:  the Rust paths, in Markdown;
# summary:  the strongest evidence, a few words (the short tables);
# python:   false for a module without Python bindings;
# evidence: one item per line, `- <kind>: "<Markdown>"`, the kind one of recording,
#           table, curve, claim, closed_form (the `evidence` of the validation cards,
#           validation/cards/README.md) or self (self-consistency: round trips,
#           invariants, the library against itself); an item that cites a card has one
#           of the kinds of that card;
# gaps:     the cell of docs/MATURITY.md, in Markdown ("<br>" separates items).
#
# The level is computed from the kinds, not written: A (a recording, table, curve or
# claim: an external reference), else B (a closed form), else C (self-consistency).

- theme: Foundations
  name: "Constellations, mapping, demapping and closed-form error rates"
  modules: "`comnum_mapping::{constellation, demapper, theory}`"
  summary: "OptiCommPy outputs; closed forms of Proakis & Salehi"
  evidence:
    - recording: "OptiCommPy 0.11, recorded: `tests/oracle/test_oracle.py::test_gray_mapping_points_and_labels`, `::test_gray_code`, `::test_modulate_and_demodulate`, `::test_theory_ber`, `::test_theory_ber_of_bpsk_is_exact_where_opticommpy_doubles_it`"
    - closed_form: "Proakis & Salehi, *Digital Communications*, 5th ed., 2008, Sec. 4.3: `specs/validation/proakis_awgn.yaml` (47 checks; CI, `comnum verify`), `specs/validation/required_snr.yaml` (the inverted closed forms, `validation/tests/simulation/specs.rs::operating_points_follow_the_inverted_closed_forms`)"
    - table: "Cho & Yoon, *IEEE Trans. Commun.* 50(7), 2002: Table I verbatim (`crates/comnum-mapping/src/theory.rs`, `literature::cho_2002_table_1`), the exact Gray BER of PAM, square and rectangular QAM (eqs. (9)–(22)) against an enumeration of the decision regions of the library's Gray labels (10⁻¹³), the 4–5 dB per extra bit of Fig. 2"
    - closed_form: "the density of the phase of a carrier in noise (Rice 1948; eq. (8) of Ahmed et al. 2007) integrates to the BER of BPSK and the SER of QPSK"
    - self: "self-consistency: `crates/comnum-mapping/src/demapper.rs::llr_signs_and_max_log`, `::multi_stream_map_demap_round_trip`, `crates/comnum/tests/links.rs::llr_signs_are_the_hard_decisions`"
  gaps: "• the closed forms of Proakis & Salehi are checked, not its figures<br>• `theory_ber` of Gray QAM is the nearest-neighbour approximation, optimistic for 64-QAM below 4 dB (example `ber_awgn`)<br>• custom constellations: self-consistency only"
- theme: Foundations
  name: "Capacity and cutoff rate of CM and BICM"
  modules: "`comnum_mapping::theory::{constellation_mi, constellation_gmi}`, `comnum_mapping::bicm`"
  summary: "Caire, Taricco & Biglieri 1998 Figs. 4–7"
  evidence:
    - curve: "`crates/comnum-mapping/src/bicm.rs::literature` against Caire, Taricco & Biglieri, *IEEE Trans. Inf. Theory* 44(3), 1998: Figs. 4–5 (CM and BICM capacity of 4PSK, 8PSK, 16QAM, Gray and set partitioning, AWGN and Rayleigh fading) within 0.1 bit"
    - curve: "`validation/tests/coding/caire1998.rs`: Figs. 6–7 and Sec. III-C (cutoff rates of 16- to 256QAM; 256QAM gaps of 2.55 dB at $R_{0} = 3$ and 0.34 dB at 7 over AWGN, BICM 4.0 dB ahead at 7 over Rayleigh fading), the quadrature against a Monte Carlo of eq. (19)"
    - self: "`crates/comnum-mapping/src/bicm.rs::the_capacities_over_rayleigh_fading_match_a_simulation`, `::the_bhattacharyya_factor_of_bpsk_is_closed`, `::the_rayleigh_mean_of_the_cm_cutoff_rate_is_its_closed_form`"
  gaps: "• the quasi-Gray labellings of 8-, 32- and 128QAM and the orthogonal signals of Figs. 8–9 are not implemented<br>• the \"more than 3 dB\" of Sec. III-C is 2.55 dB (2.7 dB read on Fig. 6)"
- theme: Foundations
  name: "Adaptive MQAM over fading"
  modules: "`comnum_mapping::link_adaptation`"
  summary: "Goldsmith & Chua 1997 Figs. 3, 5, 10, Table II"
  python: false
  evidence:
    - table: "card [`goldsmith1997_adaptive_mqam`](../validation/cards/goldsmith1997_adaptive_mqam.yaml): Table II of Goldsmith & Chua (*IEEE Trans. Commun.* 45(10), 1997), the threshold gamma_K* to four digits and the average fade region durations within 1.3 %"
    - curve: "the same card: the capacity with water-filling in time, continuous and five-region discrete MQAM within 0.07 bit/s/Hz of Figs. 3 and 5, the BER under an estimation error within 5 % of Fig. 10"
    - self: "`crates/comnum-mapping/src/link_adaptation.rs::the_cutoff_solves_eq_6_and_mqam_pays_the_gap`, `::discrete_rates_approach_the_continuous_one_and_saturate`"
  gaps: "• Rayleigh fading only (no log-normal or Nakagami density)<br>• the policies are closed forms: no simulated BER of an adaptive link (Figs. 6-7)<br>• no channel inversion, no Python binding"
- theme: Foundations
  name: "Sources (bits, PRBS, uniform and shaped symbols)"
  modules: "`comnum_mapping::source`"
  summary: "ITU-T O.150 Sec. 5 and Table 1, exact"
  evidence:
    - table: "ITU-T O.150 (05/96), Sec. 3 to 5 and Table 1: the eight test sequences of `O150Sequence` over a whole period, exact (the order of $x$ modulo each polynomial, the longest runs of zeros of Table 1, the inverted outputs, the zero suppression of Sec. 5.5, the first bits of Sec. 5.1): `validation/tests/modulation/o150.rs`, card `o150_sec5`"
    - self: "`crates/comnum-mapping/src/source.rs::prbs_periods_and_balance` (maximal periods of orders 7 to 31), `::shaped_symbols_follow_the_distribution`"
  gaps: "• `prbs` (any register state, never inverted) is the O.150 polynomials at another phase; the sequences of the Recommendation are `O150Sequence`<br>• the shaped symbols: self-consistency only"
- theme: Foundations
  name: "Differential PSK"
  modules: "`comnum_mapping::differential`, `comnum_mapping::theory::ber_dpsk`"
  summary: "Pawula, Rice & Roberts 1982 Sec. IV-A; closed forms of Proakis & Salehi"
  evidence:
    - table: "`crates/comnum-mapping/src/differential.rs`, `literature::proakis_dbpsk_noncoherent_ber` (½ e^{−Eb/N0}, Proakis & Salehi, 5th ed., Sec. 4.5), `literature::pawula_rice_roberts_1982_mdpsk_ber` (DQPSK, D8PSK; Pawula, Rice & Roberts, *IEEE Trans. Commun.* 30(8), 1982, Sec. IV), `literature::pawula_rice_roberts_1982_section_iv_a` (their eq. (44), the asymptote (46), the table of Q after eq. (50), footnote 11), `literature::proakis_coherent_detection_with_differential_decoding` (2p(1 − p))"
    - closed_form: "the same from Python: `tests/test_differential.py::test_proakis_dbpsk_noncoherent_ber_at_8_db`, `::test_pawula_rice_roberts_dqpsk_noncoherent_ber_at_8_db`, `::test_proakis_coherent_detection_with_differential_decoding`"
  gaps: "• AWGN only; unequal SNRs and a phase error of the reference (Pawula et al., Secs. II-C and IV-D) are not covered"
- theme: Foundations
  name: "Error rates with an imperfect channel estimate and over Jakes' fading"
  modules: "`comnum_mapping::imperfect_csi`"
  summary: "Chang & Su 2002 eqs. 31–53, Figs. 3–4"
  evidence:
    - curve: "`validation/tests/synchronisation/chang2002.rs` against Chang & Su, *IEEE Trans. Wireless Commun.* 1(4), 2002: eqs. 31, 32 and 53 (BPSK, Gray QPSK, Gray 16-QAM with an estimate of correlations ρ1, ρ2) and eqs. 40, 41 (DBPSK, Gray DQPSK over Jakes' fading) against Monte Carlo simulations of their model within three binomial standard errors (ignored); Fig. 4 (16-QAM floors, ρ1 from 0.999 to 1) and Fig. 3 (DBPSK floors) at the values read on the figures within 30 %"
    - closed_form: "`imperfect_csi::tests`: eq. 53 with Table I reduces to eq. 69 (the transcription of Table I), eqs. 42, 43, 68; `comnum_math::bessel_j0` against SciPy to 10⁻¹⁴; gallery `waveforms/plot_03_ofdm_theory_with_impairments.py`"
  gaps: "• two misprints of the paper documented: the asymptote of 16-QAM is 0.4972/γ̄b (printed 0.4952/γ̄b); the curve of Fig. 3 labelled f_D T_s = 0.05 is f_D T_s = 0.005<br>• the weighting vectors of specific pilot patterns (their Sec. IV, Figs. 5–7) are not reproduced: the receiver gives (ρ1, ρ2)"
- theme: Coding and shaping
  name: "Convolutional codes (Viterbi, BCJR)"
  modules: "`comnum_fec::conv`"
  summary: "AFF3CT; Yasuda et al. Table I"
  evidence:
    - recording: "AFF3CT v4.7.1 (Cassagne et al., *SoftwareX* 10, 2019), recorded: `validation/tests/coding/aff3ct.rs::conv_k7_viterbi_matches_aff3ct` ((133, 171), K = 7, 64 information bits, terminated, soft Viterbi; 0 to 4.5 dB, FER down to 2·10⁻⁴)"
    - self: "`crates/comnum-fec/src/conv.rs::the_k7_code_has_free_distance_10`; `::viterbi_corrects_errors_and_bcjr_agrees`, `::recursive_codes_terminate_and_are_systematic`"
    - recording: "Sionna (Apache-2.0), its reference vectors: `tests/oracle/test_sionna_vectors.py::test_convolutional_codes` (rates 1/2, 1/3, 1/4, generators (5, 7), (15, 17), (5, 7, 7), (5, 7, 7, 7); codewords and Viterbi decisions bit for bit)"
    - recording: "the decoding throughput of every code recorded from AFF3CT against AFF3CT v4.7.1, one thread (`tools/speed_aff3ct.py`, `validation/src/bin/speed_fec.rs`, `benchmarks/aff3ct/`; the table in `docs/python/comparisons.rst`)"
  gaps: "• BCJR (log-MAP, max-log) checked against Viterbi and through the turbo code only<br>• hard-decision Viterbi and other generators: self-consistency only<br>• BPSK over AWGN only"
