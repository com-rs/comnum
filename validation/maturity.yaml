    - recording: "Sionna (Apache-2.0), its reference vectors: `tests/oracle/test_sionna_vectors.py::test_lte_turbo_code` (K = 40, 112, 168, 432: codewords and the decisions of 10 iterations of log-MAP at 0 dB bit for bit); the 188 QPP coefficients of TS 36.212 Table 5.1.3-3 (transcribed from Sionna, each a permutation, `turbo::tests::the_lte_qpp_table_gives_permutations`)"
