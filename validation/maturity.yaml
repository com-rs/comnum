  modules: "`comnum_fec::nr`"
  summary: "Sionna vectors bit for bit; TS 38.212 tables"
  evidence:
    - table: "the tables of 3GPP TS 38.212 V18.5.0 extracted from the standard (the 513 entries of the two LDPC base graphs, the polar sequence of 1024 positions, the input and sub-block interleavers), the base graphs and the polar sequence identical to the transcriptions of Sionna; `nr::ldpc::tests`, `nr::polar::tests` (dimensions, permutations, the extension structure, every lifting size encodes codewords, round trips through puncturing, shortening, repetition and parity-check bits)"
    - recording: "Sionna (Apache-2.0), its reference vectors: `tests/oracle/test_sionna_vectors.py::test_nr_ldpc` (the codewords of 28 (K', E) through its generator matrices, 64 to 8448 bits, both base graphs, the circular buffer with repetition), `::test_nr_polar_uplink` (five (A, E) of the uplink control information, CRC11, puncturing, shortening, repetition, the triangular interleaver), bit for bit"
    - closed_form: "`validation/tests/coding/nr_codes.rs` (ignored): the block error rate at 1e-2 over BPSK within 0.2 to 1 dB of the normal approximation (Polyanskiy, Poor & Verdú 2010) for the LDPC code (measured 0.63 dB, K' = 500, E = 1000) and within 0.5 to 2 dB for the polar code (1.1 dB, A = 40, E = 128, L = 8); gallery `coding/plot_03_nr_codes.py`"
  gaps: "• one code block: no segmentation, no limited buffer, no HARQ combining; the DCI CRC (24 ones prepended, RNTI masking) is left to the caller<br>• the decoders are those of `comnum_fec::ldpc` and `comnum_fec::polar`: not compared with the decoding of a reference implementation"
