  tested: "Figs. 4-5 (CM and BICM capacity, Gray and set partitioning, AWGN and Rayleigh) within 0.1 bit; Figs. 6-7 and Sec. III-C (cutoff rates of 16- to 256QAM); the quadrature against a Monte Carlo of eq. (19)"
  tests:
    - crates/comnum-mapping/src/bicm.rs::caire_1998_figs_4_5_capacity
    - validation/tests/coding/caire1998.rs::caire_1998_fig_6_awgn_cutoff_rate
    - validation/tests/coding/caire1998.rs::caire_1998_fig_7_rayleigh_cutoff_rate
  badge: green
  not_covered: "the quasi-Gray labellings of 8-, 32- and 128QAM; the orthogonal signals of Figs. 8-9"
  remarks:
    - "Sec. III-C: \"CM 256QAM gains more than 3 dB over BICM at R0 = 3\"; eqs. (17)-(21) give 2.55 dB and Fig. 6 itself about 2.7 dB"
