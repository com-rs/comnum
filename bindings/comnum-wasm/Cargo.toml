[package]
name = "comnum-wasm"
description = "WebAssembly bindings of comnum for the browser playground (wasm-bindgen): run a declarative specification in a web page"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

# wasm-bindgen's macros expand to unsafe code: the workspace lints apply except `unsafe_code`
[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"

[dependencies]
comnum = { workspace = true, features = ["optical", "spec"] }
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
